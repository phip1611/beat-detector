name: Build

on: [ push, pull_request, merge_group ]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [ stable, nightly ]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      # required by cpal
      - run: sudo apt update && sudo apt install -y libasound2-dev
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo test --features simd
      - run: cargo test --no-default-features

  # Only the library: dev-dependencies need a newer Rust.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt update && sudo apt install -y libasound2-dev
      - run: cargo +1.88.0 build --lib
      - run: cargo +1.88.0 build --lib --no-default-features
      - run: cargo +1.89.0 build --lib --features simd

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build --lib --no-default-features --features simd --target thumbv7em-none-eabihf

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt update && sudo apt install -y libasound2-dev
      # Only checks that the benchmark runs; CI machines are too noisy for
      # meaningful numbers.
      - run: cargo bench -- --quick --noplot

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt update && sudo apt install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --document-private-items --all-features
